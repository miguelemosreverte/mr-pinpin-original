<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbfcfa">
  <meta name="description" content="Мистер Пин-Пин. Глава первая новой иллюстрированной книги.">
  <title>Мистер Пин-Пин</title>
  <link rel="stylesheet" href="reader.css?v=editorial-two">
  <link rel="stylesheet" href="editorial.css?v=timber-tractor-1">
  <link rel="stylesheet" href="edition.css?v=chapter-library">
  <link id="paper-styles" rel="stylesheet" href="paper.css?v=timber-tractor-1" media="print">
  <link rel="stylesheet" href="print.css?v=chapter-library" media="print">
  <script src="locale.js?v=margin-preview" defer></script>
  <script src="chapter-editions.js?v=chapter-two" defer></script>
  <script src="standalone-stories.js?v=timber-tractor-3" defer></script>
  <script src="reader.js?v=timber-tractor-2" defer></script>
</head>
<body>
  <button id="controls-toggle" class="icon-button controls-toggle" aria-label="Book controls" title="Book controls" aria-expanded="false" aria-controls="reader-controls"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
  <aside id="reader-controls" class="toolbar" aria-label="Book controls">
    <a class="icon-button library-link" href="library.html?lang=en" title="Chapters" aria-label="Chapters"><i data-lucide="library-big" aria-hidden="true"></i></a>
    <div class="language-selector" role="group" aria-label="Language">
      <button data-lang="en" title="English" aria-label="English" aria-pressed="false"></button>
      <button data-lang="es" title="Español" aria-label="Español" aria-pressed="false"></button>
      <button data-lang="ru" title="Русский" aria-label="Русский" aria-pressed="true"></button>
    </div>
    <button id="preview" class="icon-button" title="Print preview" aria-label="Print preview" aria-pressed="false" disabled><i data-lucide="book-open" aria-hidden="true"></i></button>
    <button id="print" class="icon-button" title="Печать / PDF" aria-label="Печать / PDF" disabled><i data-lucide="printer" aria-hidden="true"></i></button>
  </aside>
  <div class="reading-progress" aria-hidden="true"><div id="progress"></div></div>
  <p id="export-status" class="export-status" role="status" aria-live="polite"></p>
  <main id="reader" aria-busy="true"><p class="loading" role="status">Загрузка книги…</p></main>
  <nav class="reader-footer" aria-label="Book navigation"><a class="library-link" href="library.html?lang=en"><i data-lucide="library-big" aria-hidden="true"></i><span id="library-label">Chapters</span></a></nav>

  <script src="icons.js"></script>
</body>
</html>
