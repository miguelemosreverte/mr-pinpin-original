<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr. PinPin - Chapter 1 Landscape Plates</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #242424; font-family: system-ui, sans-serif; }
    main { max-width: 1536px; margin: auto; }
    header { padding: 24px 20px; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    p { margin: 8px 0 0; color: #555; font-size: 14px; }
    figure { margin: 0; border-top: 1px solid #ddd; }
    figcaption { padding: 16px 20px; font-size: 18px; font-weight: 600; line-height: 1.4; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <header><h1>Mr. PinPin</h1><p>Chapter 1 / Landscape plates / Draft 4</p></header>
    <figure id="approach-100m">
      <figcaption>1a. Through the forest</figcaption>
      <img src="../images/chapter-01-landscapes/approach-100m.png" width="1536" height="1024" alt="The earliest approach view: an empty winding forest path, with the lake hidden behind trees and the willow far ahead.">
    </figure>
    <figure id="approach-50m">
      <figcaption>1b. Approaching the willow</figcaption>
      <img src="../images/chapter-01-landscapes/approach-50m.png" width="1536" height="1024" alt="Farther along the same trail, the leaning willow appears ahead and the dry lakebed is glimpsed through trees on the left.">
    </figure>
    <figure id="shot-1">
      <figcaption>1c. The path above the lake</figcaption>
      <img src="../images/chapter-01-landscapes/shot-01-camera-02.png" width="1536" height="1024" alt="A narrow woodland path recedes on the right, above the dry lakebed on the left. A close willow trunk and its exposed roots separate the path from the lower basin.">
    </figure>
    <figure id="shot-2">
      <figcaption>2. Dry lake reveal</figcaption>
      <img src="../images/chapter-01-landscapes/shot-02.png" width="1536" height="1024" alt="A shallow dry woodland lake basin, with a leaning willow on the left and pale stones beside reeds on the opposite shore.">
    </figure>
    <figure id="shot-3">
      <figcaption>3. Dry shoreline</figcaption>
      <img src="../images/chapter-01-landscapes/shot-03.png" width="1536" height="1024" alt="A low view across cracked lakebed clay, with an exposed root and small stones in the foreground.">
    </figure>
    <figure id="shot-5">
      <figcaption>5. Water returning</figcaption>
      <img src="../images/chapter-01-landscapes/shot-05.png" width="1536" height="1024" alt="A small pool of water wells up inside a circular mark on the dry lakebed, leaving open dry ground to the left.">
    </figure>
    <figure id="shot-6">
      <figcaption>6. Water spreading</figcaption>
      <img src="../images/chapter-01-landscapes/shot-06.png" width="1536" height="1024" alt="Water spreads across the middle of the lakebed, leaving a broad area of dry cracked earth in the foreground.">
    </figure>
    <figure id="shot-7">
      <figcaption>7. Nearing the banks</figcaption>
      <img src="../images/chapter-01-landscapes/shot-07.png" width="1536" height="1024" alt="The rising lake reaches toward the willow roots and pale shoreline stones, leaving a narrow muddy edge.">
    </figure>
    <figure id="shot-8">
      <figcaption>8. The lake restored</figcaption>
      <img src="../images/chapter-01-landscapes/shot-08.png" width="1536" height="1024" alt="The full woodland lake has fresh shoreline plants, water lilies and four small fish visible through the clear shallows.">
    </figure>
    <figure id="shot-9">
      <figcaption>9. Beneath the surface</figcaption>
      <img src="../images/chapter-01-landscapes/shot-09.png" width="1536" height="1024" alt="A partly submerged view shows four fish among underwater plants, with the willow and far bank visible above the waterline.">
    </figure>
  </main>
</body>
</html>
