<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Shire | Forward and backward loop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; color: #242824; font-family: system-ui, sans-serif; line-height: 1.5; letter-spacing: 0; }
    main { max-width: 1256px; margin: auto; padding: 20px 28px; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 8px; }
    p { font-size: 14px; color: #606760; margin: 8px 0 16px; }
    video { display: block; width: 100%; max-height: 80vh; aspect-ratio: 4 / 3; object-fit: contain; background: #e9e9e9; }
    nav { display: flex; flex-wrap: wrap; gap: 16px 28px; border-top: 1px solid #ddd; padding-top: 16px; }
    a { color: #24583e; text-underline-offset: 4px; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (max-width: 760px) { main { padding: 16px 12px; } h1 { font-size: 22px; } video { max-height: none; } }
  </style>
</head>
<body>
  <main>
    <h1>The Shire / Forward and backward loop</h1>
    <p>10 seconds / Seedance 1.0 Pro Fast / Steady-light version</p>
    <video controls autoplay muted loop playsinline preload="auto" src="../videos/shire-seedance1-pingpong-v1.mp4" poster="../images/atlas/shire-v1.png" aria-label="Atlas forward and backward loop"></video>
    <p id="status" role="status">Loading video...</p>
    <nav aria-label="Review files">
      <a href="../videos/shire-seedance1-pingpong-v1.mp4">Loop video</a>
      <a href="../videos/shire-seedance1-steady-light-v1.mp4">Original forward video</a>
      <a href="atlas-steady-light.html">Lighting comparison</a>
    </nav>
  </main>
  <script>
    const video = document.querySelector('video');
    const status = document.getElementById('status');
    const update = () => {
      status.textContent = video.error ? 'Video unavailable. Poster only.' :
        video.readyState >= 3 ? (video.paused ? 'Ready / paused' : 'Playing') : 'Loading video...';
    };
    ['loadeddata', 'canplay', 'playing', 'pause', 'waiting', 'error'].forEach(event => video.addEventListener(event, update));
    update();
  </script>
</body>
</html>
