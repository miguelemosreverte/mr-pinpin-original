<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Shire | Video review</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      background: #fafafa;
      color: #242824;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      letter-spacing: 0;
    }
    main { width: 100%; padding: 28px 32px 32px; }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px 24px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 28px; font-weight: 550; line-height: 1.2; }
    header p { margin: 0; color: #606760; font-size: 14px; }
    figure { margin: 0; }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      object-fit: contain;
      background: #e8ece7;
    }
    figcaption {
      margin-top: 14px;
      color: #606760;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #dce1da;
    }
    a { color: #24583e; text-underline-offset: 4px; }
    a:hover { color: #153423; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
    @media (max-width: 600px) {
      main { padding: 20px 12px 24px; }
      h1 { font-size: 24px; }
      header { margin-bottom: 16px; }
      nav { column-gap: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">The Shire</h1>
      <p>Kling 3 Pro / Video review</p>
    </header>
    <figure>
      <video controls autoplay muted loop playsinline preload="metadata"
        src="../videos/shire-kling-loop-v1.mp4"
        poster="../images/atlas/shire-v1.webp"
        aria-labelledby="title" aria-describedby="caption">
        <a href="../videos/shire-kling-loop-v1.mp4">Open original video</a>
      </video>
      <figcaption id="caption">Rejected: insufficient visible water and tree movement. 1764 x 1176 / 24 fps / 8.04 seconds.</figcaption>
    </figure>
    <nav aria-label="Review files">
      <a href="../videos/shire-kling-loop-v1.mp4">Original generation</a>
      <a href="../images/atlas/shire-v1.webp">Approved map</a>
    </nav>
  </main>
</body>
</html>
